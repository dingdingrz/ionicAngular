<ion-header>
  <ion-toolbar color="primary">
    <ion-title>英雄之旅 SQLite Demo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ isEdit ? '编辑英雄' : '新增英雄' }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form #heroForm="ngForm" (ngSubmit)="submitSave(heroForm)">
        <ion-item>
          <ion-label position="stacked">英雄名称</ion-label>
          <ion-input name="name" [(ngModel)]="formData.name" placeholder="输入名称"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">战力</ion-label>
          <ion-input type="number" name="power" [(ngModel)]="formData.power"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">技能</ion-label>
          <ion-input name="skill" [(ngModel)]="formData.skill"></ion-input>
        </ion-item>
        <div class="button-group">
          <ion-button type="submit" color="success">{{ isEdit ? '保存修改' : '新增英雄' }}</ion-button>
          <ion-button type="button" fill="outline" color="medium" (click)="resetForm(); heroForm.resetForm();">重置</ion-button>
          <ion-button type="button" fill="outline" color="warning" (click)="addTestData()">导入测试数据</ion-button>
        </div>
      </form>
    </ion-card-content>
  </ion-card>

  <ion-list-header class="ion-margin-top">英雄列表</ion-list-header>
  <ion-list>
    <ion-item *ngFor="let hero of heroList">
      <ion-label>
        <h2>{{ hero.name }}</h2>
        <p>战力：{{ hero.power }} | 技能：{{ hero.skill }}</p>
      </ion-label>
      <ion-button slot="end" size="small" color="primary" (click)="editItem(hero)">编辑</ion-button>
      <ion-button slot="end" size="small" color="danger" (click)="deleteItem(hero.id!)">删除</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
