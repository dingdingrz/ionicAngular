<ion-header>
  <ion-toolbar>
    <ion-title>英雄之旅</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-list>
    <ion-item-sliding *ngFor="let item of heroList let index = index">
      <ion-item>
        <ion-label>{{item.name}}</ion-label>
      </ion-item>
      <ion-item-options>
        <ion-item-option (click)="handleEdit(item)">编辑</ion-item-option>
        <ion-item-option (click)="handleDelete(item)">删除</ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>
<app-model-dialog
 [isOpenDialog]="isOpenDialog"
 [editObj]="currentObj"
  (closeDialog)="handleCloseDialog($event)"></app-model-dialog>
